plugins {
    id "com.android.application"
}

android {
    namespace "app.chopchop.tools"
    compileSdk 35

    defaultConfig {
        applicationId "app.chopchop.tools"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
